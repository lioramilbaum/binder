services:
  app:
    build: .
    environment:
      # Containers reach PostgreSQL by its Compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-binder}:${POSTGRES_PASSWORD:-binder_dev}@postgres:5432/${POSTGRES_DB:-binder}
      BINDER_HOST: 0.0.0.0
      BINDER_PORT: 8000
      BINDER_LOCALE: ${BINDER_LOCALE:-}
      BINDER_MAX_UPLOAD_MB: ${BINDER_MAX_UPLOAD_MB:-2048}
      BINDER_GOOGLE_DRIVE_IMPORT_ENABLED: ${BINDER_GOOGLE_DRIVE_IMPORT_ENABLED:-}
      BINDER_GOOGLE_CLIENT_ID: ${BINDER_GOOGLE_CLIENT_ID:-}
      BINDER_GOOGLE_API_KEY: ${BINDER_GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      BINDER_SEMANTIC_SEARCH: ${BINDER_SEMANTIC_SEARCH:-}
      BINDER_EMBEDDING_MODEL: ${BINDER_EMBEDDING_MODEL:-bge-m3}
      BINDER_EMBEDDING_DIMENSIONS: ${BINDER_EMBEDDING_DIMENSIONS:-1024}
      BINDER_SEMANTIC_MIN_SIMILARITY: ${BINDER_SEMANTIC_MIN_SIMILARITY:-}
      BINDER_ASK: ${BINDER_ASK:-}
      BINDER_CHAT_MODEL: ${BINDER_CHAT_MODEL:-gemma3:4b}
      BINDER_CHAT_TIMEOUT: ${BINDER_CHAT_TIMEOUT:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        # Not "service_healthy": the first start pulls the embedding model, which takes a while.
        # Search falls back to keywords until Ollama answers.
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    build: ./docker/postgres
    # Built locally with the pgvector extension added to the official image.
    image: binder-postgres:18.6-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binder}
      POSTGRES_USER: ${POSTGRES_USER:-binder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binder_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A local folder (not a Docker volume) so pruning Docker storage cannot delete the data.
      - ./.postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    build: ./docker/ollama
    image: binder-ollama:latest
    volumes:
      - ./.ollama-data:/root/.ollama
    environment:
      BINDER_EMBEDDING_MODEL: ${BINDER_EMBEDDING_MODEL:-bge-m3}
      BINDER_ASK: ${BINDER_ASK:-}
      BINDER_CHAT_MODEL: ${BINDER_CHAT_MODEL:-gemma3:4b}
    ports:
      - "127.0.0.1:11434:11434"
