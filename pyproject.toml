[project]
name = "binder"
version = "0.1.0"
description = "A small MVP for managing information folders."
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pypdf>=6.21.1",
  "python-dotenv==1.2.4",
  "sqlalchemy==2.1.6",
]

[project.scripts]
binder-server = "binder.app:run"
binder-import-json = "binder.json_import:main"
binder-dedupe = "binder.dedupe:main"
binder-search = "binder.search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binder"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
